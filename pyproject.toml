[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-allocator"
version = "0.1.0"
description = "CLI for target-based allocation across brokerage accounts"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "yfinance",
]

[project.scripts]
portfolio-allocator = "portfolio_allocator:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.16.4",
]

[tool.uv]
required-version = "==0.12.6"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "allocation",
    "configuration",
    "market_data",
    "portfolio_allocator",
    "reporting",
]

[tool.ruff]
line-length = 300
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]
